<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Open Graph -->
    <meta property="og:title" content="FiatWallet — Buy & Sell Stablecoins on Solana" />
    <meta property="og:description" content="FiatWallet is an onchain P2P platform that lets anyone buy and sell stablecoins — no KYC needed, powered by Solana." />
    <meta property="og:url" content="https://fiatwallet.app" />
    <meta property="og:image" content="https://fiatwallet.app/logo.jpg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FiatWallet — Buy & Sell Stablecoins on Solana" />
    <meta name="twitter:description" content="FiatWallet is an onchain P2P platform that lets anyone buy and sell stablecoins — no KYC needed, powered by Solana." />

    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <link rel="icon" type="image/png" href="/icon512.png" />
    <link rel="shortcut icon" href="/logo.jpg" />
    <link rel="apple-touch-icon" href="/logo.jpg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a1628" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      window.global = window;
      window.process = window.process || { env: {}, browser: true, version: '' };
      window.addEventListener('error', function (e) {
        console.error('Fatal initialization error:', e.error || e.message);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0)) {
          root.innerHTML = '<div style="min-height:100vh;background:#0a1628;color:#f0f6ff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:\'Space Grotesk\',sans-serif;text-align:center;"><div style="background:#111e38;border:1px solid rgba(255,255,255,0.09);border-radius:20px;padding:32px 24px;max-width:440px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,0.45);"><h2 style="font-size:20px;font-weight:800;color:white;margin-bottom:8px;">Display Initialization</h2><p style="font-size:13px;color:rgba(240,246,255,0.6);margin-bottom:18px;">An unexpected error occurred while loading the app.</p><div style="background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);border-radius:12px;padding:12px;font-size:12px;color:#f87171;font-family:\'DM Mono\',monospace;margin-bottom:20px;text-align:left;word-break:break-word;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</div><button onclick="try{localStorage.clear();sessionStorage.clear();}catch(err){}window.location.reload();" style="width:100%;padding:12px;background:#a3e635;border:none;border-radius:12px;color:#0a1628;font-weight:700;cursor:pointer;font-size:13px;">Clear Cache & Reload</button></div></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
